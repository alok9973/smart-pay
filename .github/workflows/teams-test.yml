name: Teams Webhook Test

on:
  workflow_dispatch:
  schedule:
    - cron: "35 13 * * *"   # 7:05 PM IST daily

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Teams message
        run: |
          MSG="🚀 Teams webhook working | Repo: ${{ github.repository }} | Trigger: ${{ github.event_name }}"
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"$MSG\"}" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"
