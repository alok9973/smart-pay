name: Teams Webhook Test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Teams message
        run: |
          payload=$(cat <<EOF
          {
            "text": "🚀 Teams Webhook Test SUCCESS\nRepository: ${{ github.repository }}\nTrigger: ${{ github.event_name }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          )

          curl -H "Content-Type: application/json" \
               -d "$payload" \
               "${{ secrets.TEAMS_WEBHOOK_URL }}"
