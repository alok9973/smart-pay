name: PR CI Demo (Label on Failure)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write   # required for label create/update

jobs:
  demo-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- DEMO STEP ----
      # Toggle exit 1 / exit 0 to test behavior
      - name: Run demo check
        run: |
          echo "Running demo CI check..."
          exit 1   # ❌ fail (change to exit 0 to simulate success)

  label-on-result:
    needs: demo-ci
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Ensure ci-failed label exists (red)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "ci-failed"
              });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "ci-failed",
                color: "d73a4a",
                description: "CI checks failed"
              });
            }

      - name: Add ci-failed label on failure
        if: needs.demo-ci.result != 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["ci-failed"]
            });

      - name: Remove ci-failed label on success
        if: needs.demo-ci.result == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: "ci-failed"
              });
            } catch (e) {
              // label might not exist — ignore
            }
